name: Roll the availability line

# The line on the site names a month, so it goes stale on its own. This keeps
# it looking forward. Runs on the 1st at 12:00 UTC, and can be run by hand
# from the Actions tab any time Joel gives a new answer.
on:
  schedule:
    - cron: '0 12 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update the availability line
        run: python3 scripts/update-availability.py

      - name: Commit if it changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html contact.html
            git commit -m "Roll the availability line forward"
            git push
          else
            echo "Already current, nothing to commit."
          fi
